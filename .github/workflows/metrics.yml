name: Generate GitHub Profile Metrics

on:
  # Runs automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:
  # Runs automatically whenever you update your README or workflow
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # =========================================================================
      # CARD 1: INTRODUCTION, ISOCALENDAR & IN-DEPTH LANGUAGES
      # Links: introduction, isocalendar, languages
      # =========================================================================
      - name: 1. Overview, Introduction, IsoCalendar & Languages
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdiali-mk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_color_scheme: dark

          # Plugin: Introduction (source/plugins/introduction/README.md)
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Plugin: Isometric Commit Calendar (source/plugins/isocalendar/README.md)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Plugin: Languages Activity (source/plugins/languages/README.md)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_other: yes
          commits_authoring: Mehdiali Kadiwala, mehdiali-mk, mehdialikadiwala@gmail.com

      # =========================================================================
      # CARD 2: CODING HABITS, FOLLOW-UP & COMMENT REACTIONS
      # Links: habits, followup, reactions
      # =========================================================================
      - name: 2. Coding Habits, Follow-up & Reactions
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_color_scheme: dark

          # Plugin: Coding Habits (source/plugins/habits/README.md)
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Plugin: Issue & PR Follow-up (source/plugins/followup/README.md)
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

          # Plugin: Comment Reactions (source/plugins/reactions/README.md)
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: count, percentage
          plugin_reactions_display: absolute

      # =========================================================================
      # CARD 3: ACHIEVEMENTS, TOPICS, STARS, STARLISTS & PROJECTS
      # Links: achievements, topics, stars, starlists, projects
      # =========================================================================
      - name: 3. Achievements, Topics, Stars, Starlists & Projects
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.ecosystem.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_color_scheme: dark

          # Plugin: Achievements (source/plugins/achievements/README.md)
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          # Plugin: Starred Topics (source/plugins/topics/README.md)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 12

          # Plugin: Recently Starred Repos (source/plugins/stars/README.md)
          plugin_stars: yes
          plugin_stars_limit: 3

          # Plugin: Star Lists (source/plugins/starlists/README.md)
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes

          # Plugin: GitHub Projects (source/plugins/projects/README.md)
          plugin_projects: yes
          plugin_projects_limit: 2
          plugin_projects_descriptions: yes

      # =========================================================================
      # CARD 4: FEATURED REPOSITORIES & PEOPLE
      # Links: people (+ featured repositories replacement)
      # =========================================================================
      - name: 4. Featured Repositories & People Network
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.community.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_color_scheme: dark

          # Featured Repositories (Replaces broken Vercel pin cards)
          plugin_repositories: yes
          plugin_repositories_featured: mehdiali-mk/JS-Learning, mehdiali-mk/cpp-learning, mehdiali-mk/bootstrap-learning, mehdiali-mk/JavaScript-Practice

          # Plugin: People (source/plugins/people/README.md)
          plugin_people: yes
          plugin_people_types: followers, following, stargazers
          plugin_people_limit: 20
          plugin_people_size: 28

      # =========================================================================
      # CARD 5: REPOSITORY LICENSES & CONTRIBUTORS
      # Links: licenses, contributors (Requires template: repository)
      # =========================================================================
      - name: 5. Repository Licenses & Contributors
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.repo.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdiali-mk
          repo: JS-Learning
          template: repository
          base: header, metadata
          config_timezone: Asia/Kolkata
          config_color_scheme: dark

          # Plugin: Repository Licenses (source/plugins/licenses/README.md)
          plugin_licenses: yes
          plugin_licenses_legal: yes
          plugin_licenses_ratio: yes

          # Plugin: Repository Contributors (source/plugins/contributors/README.md)
          plugin_contributors: yes
          plugin_contributors_sections: head, contributions
          plugin_contributors_categories: yes
