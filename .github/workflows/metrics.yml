name: Generate GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Clean up leftover SVG files from older workflow runs
      - name: Checkout & Clean Old SVGs
        uses: actions/checkout@v4
      - name: Remove unused legacy SVGs
        run: |
          git rm -f metrics.community.svg metrics.ecosystem.svg metrics.habits.svg metrics.repo.svg metrics.overview.svg metrics.detailed.svg || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove unused legacy metrics svgs"
            git push origin main
          fi

      # =========================================================================
      # CARD 1: INTRODUCTION & ISOMETRIC COMMIT CALENDAR
      # =========================================================================
      - name: 1. Introduction & Isometric Calendar
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.1.intro-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 2: LANGUAGES ACTIVITY, LINES OF CODE & COMMIT HISTORY
      # =========================================================================
      - name: 2. Languages Activity, Lines of Code & Calendar
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.2.languages-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_other: yes
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4
          plugin_calendar: yes
          plugin_calendar_limit: 2
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 3: ISSUE/PR FOLLOW-UP & COMMENT REACTIONS
      # =========================================================================
      - name: 3. Issue/PR Follow-up & Comment Reactions
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.3.followup-reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: count, percentage
          plugin_reactions_display: relative
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 4: STARRED TOPICS, NOTABLE CONTRIBUTIONS & RECENT ACTIVITY
      # =========================================================================
      - name: 4. Topics, Notable Contributions & Activity
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.4.achievements-topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 20
          plugin_notable: yes
          plugin_notable_from: all
          plugin_activity: yes
          plugin_activity_limit: 4
          plugin_activity_days: 30
          plugin_activity_filter: push, pr, issue, release
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 5: RECENT STARS, STAR LISTS & GITHUB PROJECTS
      # =========================================================================
      - name: 5. Recent Stars, Star Lists & Projects
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.5.stars-starlists-projects.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_projects: yes
          plugin_projects_limit: 2
          plugin_projects_descriptions: yes
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 6: PEOPLE NETWORK & FEATURED REPOSITORIES
      # =========================================================================
      - name: 6. People Network & Featured Repositories
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.6.people-repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_repositories: yes
          plugin_repositories_featured: mehdiali-mk/JS-Learning, mehdiali-mk/cpp-learning, mehdiali-mk/bootstrap-learning, mehdiali-mk/JavaScript-Practice
          plugin_people: yes
          plugin_people_types: followers, following, stargazers
          plugin_people_limit: 20
          plugin_people_size: 28
          extras_css: |
            .error { display: none !important; }

      # =========================================================================
      # CARD 7: REPOSITORY LICENSES & CONTRIBUTORS
      # =========================================================================
      - name: 7. Repository Licenses & Contributors
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.7.repo-licenses-contributors.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          repo: JS-Learning
          template: repository
          base: header, metadata
          config_timezone: Asia/Kolkata
          plugin_licenses: yes
          plugin_licenses_ratio: yes
          plugin_contributors: yes
          plugin_contributors_sections: base, contributions
          plugin_contributors_categories: yes
          extras_css: |
            .error { display: none !important; }
