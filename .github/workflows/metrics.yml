name: Generate GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # =========================================================================
      # CARD 1: (1) INTRODUCTION & (2) ISOMETRIC CALENDAR
      # =========================================================================
      - name: 1. Introduction & Isometric Calendar
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.1.intro-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # =========================================================================
      # CARD 2: (3) LANGUAGES ACTIVITY & (4) CODING HABITS
      # =========================================================================
      - name: 2. Languages Activity & Coding Habits
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.2.languages-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_other: yes
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # =========================================================================
      # CARD 3: (5) ISSUE/PR FOLLOW-UP & (6) COMMENT REACTIONS
      # =========================================================================
      - name: 3. Issue/PR Follow-up & Comment Reactions
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.3.followup-reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: count, percentage
          plugin_reactions_display: relative

      # =========================================================================
      # CARD 4: (7) ACHIEVEMENTS & (8) STARRED TOPICS
      # =========================================================================
      - name: 4. Achievements & Starred Topics
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.4.achievements-topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 12

      # =========================================================================
      # CARD 5: (9) RECENT STARS, (10) STAR LISTS & (11) GITHUB PROJECTS
      # =========================================================================
      - name: 5. Recent Stars, Star Lists & Projects
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.5.stars-starlists-projects.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_projects: yes
          plugin_projects_limit: 2
          plugin_projects_descriptions: yes

      # =========================================================================
      # CARD 6: (12) PEOPLE NETWORK & FEATURED REPOSITORIES
      # =========================================================================
      - name: 6. People Network & Featured Repositories
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.6.people-repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_people: yes
          plugin_people_types: followers, following, stargazers
          plugin_people_limit: 20
          plugin_people_size: 28
          plugin_repositories: yes
          plugin_repositories_featured: mehdiali-mk/JS-Learning, mehdiali-mk/cpp-learning, mehdiali-mk/bootstrap-learning, mehdiali-mk/JavaScript-Practice

      # =========================================================================
      # CARD 7: (13) REPOSITORY LICENSES & (14) REPOSITORY CONTRIBUTORS
      # =========================================================================
      - name: 7. Repository Licenses & Contributors
        uses: lowlighter/metrics@latest
        if: ${{ always() }}
        with:
          filename: metrics.7.repo-licenses-contributors.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: mehdiali-mk
          repo: JS-Learning
          template: repository
          base: header, metadata
          config_timezone: Asia/Kolkata
          plugin_licenses: yes
          plugin_licenses_ratio: yes
          plugin_contributors: yes
          plugin_contributors_sections: base, contributions
          plugin_contributors_categories: yes
